name: Build and release Docker images

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Validate semantic version tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must be a semantic version such as v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: |
            services/school-administration-api/go.sum
            services/school-user-api/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/school-administration-ui/package-lock.json

      - name: Install UI dependencies
        run: npm --prefix apps/school-administration-ui ci

      - name: Validate Goose migrations
        run: make db-validate

      - name: Test fresh database initialization
        run: make db-reset

      - name: Run tests and production builds
        run: make test build

      - name: Validate release Compose configuration
        run: docker compose --env-file deploy/.env.example -f deploy/compose.yaml config --quiet

      - name: Stop verification dependencies
        if: always()
        run: docker compose down --volumes --remove-orphans

  publish-images:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: school-administration-api
            dockerfile: services/school-administration-api/Dockerfile
          - image: school-user-api
            dockerfile: services/school-user-api/Dockerfile
          - image: school-administration-ui
            dockerfile: apps/school-administration-ui/Dockerfile
          - image: school-platform-migrations
            dockerfile: docker/migrations/Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: kennykarnama
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: docker.io/kennykarnama/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  github-release:
    needs: publish-images
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build VM deployment archive
        shell: bash
        run: |
          release_dir="school-platform-app-${GITHUB_REF_NAME}"
          mkdir "$release_dir"
          cp deploy/compose.yaml "$release_dir/compose.yaml"
          cp deploy/.env.example "$release_dir/.env.example"
          cp deploy/README.md "$release_dir/README.md"
          tar -czf "${release_dir}-linux-amd64.tar.gz" "$release_dir"
          sha256sum "${release_dir}-linux-amd64.tar.gz" > "${release_dir}-linux-amd64.tar.gz.sha256"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="school-platform-app-${GITHUB_REF_NAME}-linux-amd64.tar.gz"
          checksum="${archive}.sha256"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; replacing deployment assets"
            gh release upload "$GITHUB_REF_NAME" "$archive" "$checksum" --clobber
            exit 0
          fi

          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            "$archive" \
            "$checksum" \
            --verify-tag \
            --generate-notes \
            --title "School Platform ${GITHUB_REF_NAME}" \
            "${release_flags[@]}"
