name: school-proxy

services:
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:?DOMAIN is required}
    volumes:
      - ./templates:/etc/nginx/templates:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - app_network

  certbot:
    image: certbot/certbot:latest
    profiles: ["manual"]
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

  certbot-renew:
    image: certbot/certbot:latest
    restart: unless-stopped
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew --deploy-hook 'touch /var/www/certbot/.renewed'; sleep 12h; done"
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

networks:
  app_network:
    external: true
    name: ${APP_NETWORK:-school-platform_default}
