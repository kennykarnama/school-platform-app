name: school-platform-app

services:
  cockroach:
    image: cockroachdb/cockroach:v26.2.2
    command:
      - start-single-node
      - --insecure
      - --listen-addr=:26257
      - --http-addr=:8080
      - --store=/cockroach/cockroach-data
    ports:
      - "26257:26257"
      - "8088:8080"
    volumes:
      - cockroach-data:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD-SHELL", "cockroach sql --insecure --host=localhost:26257 --execute='SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  db-init:
    build:
      context: .
      dockerfile: docker/goose-cockroach/Dockerfile
    entrypoint: ["/bin/sh", "/workspace/scripts/init-databases.sh"]
    depends_on:
      cockroach:
        condition: service_healthy
    volumes:
      - ./:/workspace:ro
    restart: "no"

  goose:
    build:
      context: .
      dockerfile: docker/goose-cockroach/Dockerfile
    entrypoint: ["goose"]
    volumes:
      - ./:/workspace
    profiles: ["tools"]

volumes:
  cockroach-data:
  redis-data:
